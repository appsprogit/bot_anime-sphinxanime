name: Check SphinxAnime Daily

on:
  schedule:
    # 11:00 UTC corresponde a las 6:00 AM en Bogotá
    - cron: '0 11 * * *'
  workflow_dispatch:

# Permisos requeridos para que el bot pueda realizar el push
permissions:
  contents: write

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-telegram-bot
          playwright install --with-deps chromium

      - name: Run script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_anime.py

      # Solución nativa: Actualiza un archivo local y hace push usando los nuevos permisos
      - name: Prevenir inactividad (Keepalive Nativo)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "Última ejecución: $(date)" > keepalive.txt
          git add keepalive.txt
          git commit -m "Chore: Mantener workflow activo" || exit 0
          git push
