name: Check SphinxAnime Daily

on:
  schedule:
    # 13:30 UTC = 8:30 AM en Bogotá
    - cron: '0 11 * * *'
  workflow_dispatch:

# Añadimos este bloque de permisos para que la Action pueda interactuar con el repositorio
permissions:
  contents: write

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-telegram-bot
          playwright install --with-deps chromium

      - name: Run script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_anime.py

      # Paso nuevo: Evita que GitHub inactive el workflow por falta de commits en el repo
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
